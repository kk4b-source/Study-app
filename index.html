<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>問題集</title><style>body{font-family:sans-serif;max-width:700px;margin:20px auto;padding:10px}button{padding:10px;margin-top:10px}#card{border:1px solid #ccc;padding:20px;border-radius:10px}</style></head><body><div id="card"><h2>一問一答アプリ</h2><p id="count"></p><p id="question"></p><input id="answer" style="width:100%"><br><button onclick="check()">回答する</button><div id="result"></div><button id="next" onclick="nextQ()" style="display:none">次の問題</button></div><script>const questions=[{q:'OCIの正式名称は？',a:'Oracle Cloud Infrastructure',e:'Oracle社が提供するクラウドサービスです。'},{q:'住民票コードは何桁？',a:'11',e:'住民票コードは11桁です。'},{q:'個人住民税は何で構成される？',a:'都道府県民税と市町村民税',e:'住民税は2つの税で構成されます。'}];let order=[...questions].sort(()=>Math.random()-0.5);let i=0,score=0;function show(){document.getElementById('count').innerText=`${i+1}/${order.length}`;document.getElementById('question').innerText=order[i].q;document.getElementById('answer').value='';document.getElementById('result').innerHTML='';document.getElementById('next').style.display='none';}function check(){const ok=document.getElementById('answer').value.trim()===order[i].a;if(ok)score++;document.getElementById('result').innerHTML=(ok?'〇正解':'×不正解')+'<br>正解: '+order[i].a+'<br>解説: '+order[i].e;document.getElementById('next').style.display='block';}function nextQ(){i++;if(i>=order.length){document.getElementById('card').innerHTML=`<h2>終了</h2><p>正解数 ${score}/${order.length}</p><p>正答率 ${Math.round(score/order.length*100)}%</p>`;return;}show();}show();</script></body></html>
